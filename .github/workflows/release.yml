name: release

# Builds the Debian 13 package, installs and runs it on a clean system, and publishes it
# as a GitHub release when asked: run by hand with "publish" ticked, or push a tag "v*".
# A run by hand without "publish" is a rehearsal: the package is kept with the run only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as 1.3.1-fork.1 (the tag is v<version>). Empty: from the source, date and commit"
        required: false
        default: ""
      publish:
        description: "Publish a GitHub release"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git g++ python3 unzip zip \
            dpkg-dev libwxgtk3.2-dev libgl-dev libglu1-mesa-dev
      - uses: actions/checkout@v7
      - name: Choose the version
        id: version
        env:
          ASKED: ${{ inputs.version }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          commit=$(git rev-parse --short HEAD)
          if [ -n "$TAG" ]; then
              version=${TAG#v}
          elif [ -n "$ASKED" ]; then
              version=$ASKED
          else
              base=$(sed -n 's/^constexpr auto SLIC3R_VERSION = "\(.*\)";/\1/p' src/libslic3r/libslic3r.h)
              version=$base+$(date -u +%Y%m%d).$commit
          fi
          # it becomes a tag name, a file name and a Debian version
          case $version in
              [!0-9]* | *[!A-Za-z0-9.+-]* | "") echo "not a usable version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      - name: Keep Bazel's downloads and build results
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repository
          key: bazel-release-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: bazel-release-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel.lock') }}-
      - name: Install Bazelisk (it fetches the version in .bazelversion)
        run: |
          curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.31.0/bazelisk-linux-amd64
          echo "37c6c243a5a0d2cb6a16a74012c108c47ae9eb5c0455251881e66e7f393a4ce1  /usr/local/bin/bazel" | sha256sum -c -
          chmod +x /usr/local/bin/bazel
      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          # Debian sorts "~" before the release: 1.3.1-dev is older than 1.3.1
          debian=$(printf '%s' "$VERSION" | tr - '~')
          bazel build --disk_cache="$HOME/.cache/bazel-disk" \
            --repository_cache="$HOME/.cache/bazel-repository" \
            "--per_file_copt=^src/.*@-DSLIC3R_BUILD_COMMIT=$COMMIT" \
            "--define=SLIC3R_DEB_VERSION=$debian" //package:deb
          mkdir out
          cp build/bazel/bin/package/slic3r__amd64.deb "out/slic3r_${debian}_amd64.deb"
          (cd out && sha256sum ./*.deb >SHA256SUMS && cat SHA256SUMS)
          dpkg-deb -I out/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: out/

  # A clean system: only what the package asks for, then the tools of the GUI test.
  install:
    needs: package
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: /tmp/package
      - name: Install the package
        run: |
          apt-get update
          apt-get install -y --no-install-recommends /tmp/package/*.deb
      # the sources hold the models, reference output and test scripts
      - uses: actions/checkout@v7
      - name: Check the installed program
        env:
          COMMIT: ${{ needs.package.outputs.commit }}
        run: package/debian/check_installed.sh "$COMMIT" /tmp/check
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-check
          path: /tmp/check/

  publish:
    needs: [package, install]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cat >notes.md <<EOF
          Slic3r, unofficial fork: package for Debian 13 (amd64). Not affiliated with the
          original authors; maintained with the help of AI assistants. Experimental: checked
          by automated tests, check the G-code before printing.

              sudo apt install ./slic3r_*_amd64.deb

          Printer profiles for the Ender-5 Pro are in /usr/share/slic3r/profiles.
          EOF
          gh release create "v$VERSION" package/*.deb package/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Slic3r $VERSION" --notes-file notes.md
