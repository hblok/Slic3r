name: build

# Daily and on demand, not on every commit.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian13:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake make g++ \
            libboost-dev libboost-thread-dev libboost-filesystem-dev libboost-nowide-dev
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ./build/slic3r_test
      - name: Golden G-code check
        run: src/test/golden/check.sh build/slic3r

  # Perl application: XS module, Perl tests, and a GUI smoke test under Xvfb.
  perl:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make g++ \
            libboost-dev libboost-thread-dev libboost-filesystem-dev libboost-nowide-dev \
            perl liblocal-lib-perl libdevel-checklib-perl libextutils-cppguess-perl \
            libextutils-typemaps-default-perl libextutils-xspp-perl libmodule-build-withxspp-perl \
            libmoo-perl libencode-locale-perl libio-stringy-perl libclass-xsaccessor-perl \
            libclass-accessor-perl libwww-perl libwx-perl libwx-glcanvas-perl libopengl-perl \
            xvfb xauth xdotool imagemagick libgl1-mesa-dri libglu1-mesa cmake
      - uses: actions/checkout@v7
      - name: Build XS module
        run: cd xs && perl Build.PL && ./Build
      - name: XS tests
        run: cd xs && ./Build test
      - name: Perl tests
        run: PERL5LIB="$PWD/xs/blib/arch:$PWD/xs/blib/lib" prove -j"$(nproc)" t/
      - name: GUI smoke test
        run: utils/gui_smoke.sh gui-smoke
      - name: Build C++ CLI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target slic3r
      - name: C++ and Perl G-code parity
        run: src/test/golden/compare_perl.sh build/slic3r
      - name: Keep GUI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-smoke
          path: gui-smoke
