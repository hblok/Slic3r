name: build

# Daily and on demand, not on every commit.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # on the target system
  bazel:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git g++ python3 unzip zip \
            libwxgtk3.2-dev libgl-dev libglu1-mesa-dev \
            xvfb xauth xdotool imagemagick libgl1-mesa-dri
      - uses: actions/checkout@v7
      - name: Keep Bazel's downloads and build results
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repository
          key: bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel.lock') }}-
      - name: Install Bazelisk (it fetches the version in .bazelversion)
        run: |
          curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.31.0/bazelisk-linux-amd64
          echo "37c6c243a5a0d2cb6a16a74012c108c47ae9eb5c0455251881e66e7f393a4ce1  /usr/local/bin/bazel" | sha256sum -c -
          chmod +x /usr/local/bin/bazel
      - name: Build and test
        run: |
          # the GUI tests wait fixed times for the program: no more of them than cores
          bazel test --disk_cache="$HOME/.cache/bazel-disk" \
            --repository_cache="$HOME/.cache/bazel-repository" --local_test_jobs=4 //...
      - name: Keep the test logs and GUI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bazel-testlogs
          path: build/bazel/testlogs/
